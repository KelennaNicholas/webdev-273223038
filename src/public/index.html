<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Study Groups - Research Club</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 600px; margin: 40px auto; padding: 0 20px; color: #333; }
    input, button { padding: 10px; margin: 5px 0; width: 100%; box-sizing: border-box; }
    button { background: #2563eb; color: white; border: none; cursor: pointer; border-radius: 4px; }
    button:hover { background: #1d4ed8; }
    .card { border: 1px solid #e5e7eb; padding: 16px; margin: 10px 0; border-radius: 6px; background: #f9fafb; }
    .error { color: #dc2626; margin-top: 5px; }
    .hidden { display: none; }
    .empty-state { text-align: center; color: #6b7280; padding: 40px 0; font-style: italic; }
    .status { color: #166534; margin-top: 8px; }
  </style>
</head>
<body>
  <h1>Study Groups</h1>

  <!-- Sign-in Section -->
  <div id="auth-section">
    <h2>Sign In</h2>
    <form id="login-form">
      <div>
        <label for="email">Email</label>
        <input type="email" id="email" required value="student@example.com">
      </div>
      <div>
        <label for="password">Password</label>
        <input type="password" id="password" required value="securePassword123">
      </div>
      <button type="submit">Sign In</button>
      <div id="login-error" class="error"></div>
    </form>
  </div>

  <!-- Study Groups List Section (AC-14, AC-15, AC-16) -->
  <div id="app-section" class="hidden">
    <h2>Available Study Groups</h2>
    <div id="groups-loading" role="status" aria-live="polite" hidden>Loading study groups…</div>
    <div id="groups-error" class="error" role="alert" hidden>
      <p>We couldn’t load study groups. Check your connection and try again.</p>
      <button id="retry-groups" type="button">Try again</button>
    </div>
    <div id="groups-container" aria-busy="false"></div>
    <section aria-labelledby="memberships-heading">
      <h2 id="memberships-heading">My Study Groups</h2>
      <div id="memberships-container" aria-live="polite">
        <p id="memberships-empty" class="empty-state">You have not joined any study groups yet.</p>
      </div>
    </section>
  </div>

  <script>
    const loginForm = document.getElementById('login-form');
    const authSection = document.getElementById('auth-section');
    const appSection = document.getElementById('app-section');
    const loginError = document.getElementById('login-error');
    const groupsContainer = document.getElementById('groups-container');
    const groupsLoading = document.getElementById('groups-loading');
    const groupsError = document.getElementById('groups-error');
    const retryGroups = document.getElementById('retry-groups');
    const membershipsContainer = document.getElementById('memberships-container');
    const membershipsEmpty = document.getElementById('memberships-empty');
    let accessToken = null;
    const joinedGroups = new Map();
    const joiningGroups = new Set();

    retryGroups.addEventListener('click', loadStudyGroups);

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      loginError.textContent = '';
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();
        if (res.ok && data.success) {
          accessToken = data.accessToken;
          authSection.classList.add('hidden');
          appSection.classList.remove('hidden');
          loadStudyGroups();
        } else {
          loginError.textContent = data.error || 'Sign in failed';
        }
      } catch (err) {
        loginError.textContent = 'Network error during sign in';
      }
    });

    async function loadStudyGroups() {
      groupsError.hidden = true;
      groupsLoading.hidden = false;
      groupsContainer.setAttribute('aria-busy', 'true');
      groupsContainer.replaceChildren();

      try {
        const res = await fetch('/api/study-groups');
        if (!res.ok) {
          throw new Error('Study groups request failed.');
        }
        const groups = await res.json();
        if (!Array.isArray(groups)) {
          throw new Error('Study groups response was invalid.');
        }

        groupsLoading.hidden = true;
        groupsContainer.setAttribute('aria-busy', 'false');
        if (!groups || groups.length === 0) {
          const emptyState = document.createElement('p');
          emptyState.className = 'empty-state';
          emptyState.textContent = 'There are no study groups yet. Check back soon to find a group to join.';
          groupsContainer.appendChild(emptyState);
          return;
        }

        groups.forEach((group) => groupsContainer.appendChild(createGroupCard(group)));
      } catch (err) {
        groupsLoading.hidden = true;
        groupsContainer.setAttribute('aria-busy', 'false');
        groupsError.hidden = false;
      }
    }

    function createGroupCard(group) {
      const card = document.createElement('article');
      card.className = 'card';

      const heading = document.createElement('h3');
      heading.textContent = group.name;
      card.appendChild(heading);

      const subject = document.createElement('p');
      subject.textContent = `Subject: ${group.subject}`;
      card.appendChild(subject);

      const description = document.createElement('p');
      description.textContent = group.description;
      card.appendChild(description);

      const joinButton = document.createElement('button');
      joinButton.type = 'button';
      joinButton.textContent = joinedGroups.has(group.id) ? 'Joined' : 'Join group';
      joinButton.disabled = joinedGroups.has(group.id) || joiningGroups.has(group.id);
      joinButton.setAttribute('aria-label', `Join ${group.name}`);
      card.appendChild(joinButton);

      const status = document.createElement('p');
      status.className = joinedGroups.has(group.id) ? 'status' : 'error';
      status.setAttribute('aria-live', 'polite');
      card.appendChild(status);

      joinButton.addEventListener('click', () => joinGroup(group, joinButton, status));
      return card;
    }

    async function joinGroup(group, joinButton, status) {
      if (!accessToken || joiningGroups.has(group.id) || joinedGroups.has(group.id)) {
        return;
      }

      joiningGroups.add(group.id);
      joinButton.disabled = true;
      joinButton.textContent = 'Joining…';
      status.className = 'status';
      status.textContent = '';

      try {
        const res = await fetch(`/api/study-groups/${encodeURIComponent(group.id)}/join`, {
          method: 'POST',
          headers: { Authorization: `Bearer ${accessToken}` }
        });
        const data = await res.json();
        if (!res.ok) {
          status.className = 'error';
          status.textContent = res.status === 409
            ? data.error || 'This group cannot be joined.'
            : res.status === 401
              ? 'Your sign-in has expired. Please sign in again.'
              : data.error || 'Unable to join this group. Please try again.';
          joinButton.textContent = 'Join group';
          joinButton.disabled = res.status === 401;
          if (res.status === 401) {
            accessToken = null;
            appSection.classList.add('hidden');
            authSection.classList.remove('hidden');
          }
          return;
        }

        joinedGroups.set(group.id, data);
        joinButton.textContent = 'Joined';
        status.className = 'status';
        status.textContent = 'You joined this study group.';
        const membership = document.createElement('p');
        membership.textContent = `${group.name} — ${group.subject}`;
        membershipsContainer.appendChild(membership);
        membershipsEmpty.classList.add('hidden');
      } catch (err) {
        status.className = 'error';
        status.textContent = 'Network error while joining. Please try again.';
        joinButton.textContent = 'Join group';
        joinButton.disabled = false;
      } finally {
        joiningGroups.delete(group.id);
      }
    }
  </script>
</body>
</html>
