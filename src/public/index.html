<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Study Groups - Research Club</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 600px; margin: 40px auto; padding: 0 20px; color: #333; }
    input, button { padding: 10px; margin: 5px 0; width: 100%; box-sizing: border-box; }
    button { background: #2563eb; color: white; border: none; cursor: pointer; border-radius: 4px; }
    button:hover { background: #1d4ed8; }
    .card { border: 1px solid #e5e7eb; padding: 16px; margin: 10px 0; border-radius: 6px; background: #f9fafb; }
    .error { color: #dc2626; margin-top: 5px; }
    .hidden { display: none; }
    .empty-state { text-align: center; color: #6b7280; padding: 40px 0; font-style: italic; }
  </style>
</head>
<body>
  <h1>Study Groups</h1>

  <!-- Sign-in Section -->
  <div id="auth-section">
    <h2>Sign In</h2>
    <form id="login-form">
      <div>
        <label for="email">Email</label>
        <input type="email" id="email" required value="student@example.com">
      </div>
      <div>
        <label for="password">Password</label>
        <input type="password" id="password" required value="securePassword123">
      </div>
      <button type="submit">Sign In</button>
      <div id="login-error" class="error"></div>
    </form>
  </div>

  <!-- Study Groups List Section (AC-14, AC-15, AC-16) -->
  <div id="app-section" class="hidden">
    <h2>Available Study Groups</h2>
    <div id="groups-container"></div>
  </div>

  <script>
    const loginForm = document.getElementById('login-form');
    const authSection = document.getElementById('auth-section');
    const appSection = document.getElementById('app-section');
    const loginError = document.getElementById('login-error');
    const groupsContainer = document.getElementById('groups-container');

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      loginError.textContent = '';
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();
        if (res.ok && data.success) {
          authSection.classList.add('hidden');
          appSection.classList.remove('hidden');
          loadStudyGroups();
        } else {
          loginError.textContent = data.error || 'Sign in failed';
        }
      } catch (err) {
        loginError.textContent = 'Network error during sign in';
      }
    });

    async function loadStudyGroups() {
      try {
        const res = await fetch('/api/study-groups');
        const groups = await res.json();
        groupsContainer.innerHTML = '';

        if (!groups || groups.length === 0) {
          // AC-16: Clear empty-state message
          groupsContainer.innerHTML = '<div class="empty-state">No study groups available at the moment. Create one to get started!</div>';
          return;
        }

        // AC-15: Each available group's name and subject
        groups.forEach(group => {
          const card = document.createElement('div');
          card.className = 'card';
          card.innerHTML = `
            <h3>${escapeHtml(group.name)}</h3>
            <p><strong>Subject:</strong> ${escapeHtml(group.subject)}</p>
            <p>${escapeHtml(group.description)}</p>
          `;
          groupsContainer.appendChild(card);
        });
      } catch (err) {
        groupsContainer.innerHTML = '<div class="error">Failed to load study groups.</div>';
      }
    }

    function escapeHtml(str) {
      return str.replace(/[&<>'"]/g, 
        tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
      );
    }
  </script>
</body>
</html>
